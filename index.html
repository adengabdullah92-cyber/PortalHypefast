<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hypefast Legal Tech Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- CDN Supabase JS Client Terbaru -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6">

  <div class="max-w-4xl mx-auto space-y-6">
    <header class="border-b pb-4">
      <h1 class="text-2xl font-bold text-slate-900">Hypefast Legal Tech Platform</h1>
      <p class="text-sm text-slate-500">Automated BPOM Auto-Flagging & Vendor Contract Analyzer</p>
    </header>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 space-y-4">
      <h2 class="text-lg font-semibold">1. Upload Dokumen / Gambar</h2>
      
      <div>
        <label class="block text-sm font-medium mb-1">Pilih Jenis Modul</label>
        <select id="moduleType" class="w-full border rounded-lg p-2.5 bg-slate-50">
          <option value="BPOM">Modul 1: Auto-Flagging BPOM (Gambar Kemasan/Iklan)</option>
          <option value="CONTRACT">Modul 2: Contract Analyzer (PDF Kontrak Vendor)</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Pilih File</label>
        <input type="file" id="fileInput" class="w-full border rounded-lg p-2 bg-slate-50">
      </div>

      <button type="button" onclick="processAnalysis()" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">
        Mulai Analisis dengan Gemini AI
      </button>
    </div>

    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <h2 class="text-lg font-semibold mb-2">2. Status & Hasil Analisis AI</h2>
      <div id="statusText" class="text-sm font-medium text-blue-600 mb-2">Status: Siap digunakan</div>
      <pre id="outputResult" class="bg-slate-900 text-green-400 p-4 rounded-lg overflow-x-auto text-sm font-mono min-h-[150px]">
// Hasil analisis JSON dari Gemini akan tampil di sini...
      </pre>
    </div>
  </div>

  <script>
    // MASUKKAN KREDENSIAL SUPABASE KAMU DI SINI
    const SUPABASE_URL = "https://crfvzeknzixtwivlvcwe.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_Eb4W9fuDBQNHg95N-_NKwA_VNbeQUDX";

    let supabaseClient = null;

    // Inisialisasi Supabase saat halaman selesai dimuat
    window.addEventListener('DOMContentLoaded', () => {
      if (window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        document.getElementById('statusText').innerText = "Status: Terhubung ke Supabase";
      } else {
        document.getElementById('statusText').innerText = "Error: Library Supabase gagal di-load!";
        document.getElementById('statusText').className = "text-sm font-medium text-red-600 mb-2";
      }
    });

    async function processAnalysis() {
      const output = document.getElementById('outputResult');
      const statusText = document.getElementById('statusText');
      const fileInput = document.getElementById('fileInput').files[0];
      const moduleType = document.getElementById('moduleType').value;

      if (!fileInput) {
        alert("Pilih file terlebih dahulu!");
        return;
      }

      if (!supabaseClient) {
        alert("Supabase Client belum siap / kredensial belum diisi!");
        return;
      }

      statusText.innerText = "Status: Membaca file...";
      statusText.className = "text-sm font-medium text-amber-600 mb-2";
      output.innerText = "Memproses file...";

      try {
        const base64File = await convertToBase64(fileInput);

        statusText.innerText = "Status: Mengirim ke Gemini API via Supabase Edge Function...";
        
        const { data, error } = await supabaseClient.functions.invoke('gemini-analyzer', {
          body: {
            module: moduleType,
            fileName: fileInput.name,
            fileType: fileInput.type,
            fileData: base64File
          }
        });

        if (error) {
          throw new Error(error.message || "Gagal memanggil Edge Function");
        }

        statusText.innerText = "Status: Selesai!";
        statusText.className = "text-sm font-medium text-green-600 mb-2";
        output.innerText = JSON.stringify(data, null, 2);

      } catch (err) {
        statusText.innerText = "Status: Terjadi Kesalahan";
        statusText.className = "text-sm font-medium text-red-600 mb-2";
        output.innerText = "Error: " + err.message;
      }
    }

    function convertToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }
  </script>
</body>
</html>
